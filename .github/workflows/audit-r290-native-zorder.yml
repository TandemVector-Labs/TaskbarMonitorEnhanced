name: R290 hosted native Win32 Z-order regression (private candidate)

on:
  push:
    branches: [main, development/v1.7.9-zorder-fix]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'build/**'
      - '.github/workflows/audit-r290-native-zorder.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'build/**'
      - '.github/workflows/audit-r290-native-zorder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-zorder:
    name: Native Z-order on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400

      - name: Build exact unreleased candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             $env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows'){
              throw 'R290_UNSAFE_HOST_OR_COMMIT'
          }
          if(!(Test-Path build/Test-R290-NativeZOrder-Windows.ps1) -or
             !(Test-Path src/TaskbarGlass.cs)){
              throw 'R290_SOURCE_MISSING'
          }
          ./build/Build.ps1
          if($LASTEXITCODE -ne 0){throw 'R290_BUILD_FAILED'}
          $exe='build/_out/App/TaskbarMonitorEnhanced.exe'
          if(!(Test-Path $exe)){throw 'R290_BUILT_APP_NOT_FOUND'}
          $fileVersion=(Get-Item $exe).VersionInfo.FileVersion
          if($fileVersion -ne '1.7.10.0'){throw "R290_BAD_VERSION $fileVersion"}
          'R290_EXACT_BUILD_PASS'

      - name: Probe native Win32 child and top-level occlusion
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=(Resolve-Path build/Test-R290-NativeZOrder-Windows.ps1).Path
          $tokens=$null
          $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw 'R290_PS51_PARSER_FAILED'}
          $exe=(Resolve-Path build/_out/App/TaskbarMonitorEnhanced.exe).Path
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File $script -AppExe $exe
          if($LASTEXITCODE -ne 0){throw 'R290_NATIVE_ZORDER_EXECUTION_FAILED'}
          $receipt=Join-Path $env:RUNNER_TEMP 'R290_NATIVE_ZORDER_RECEIPT.json'
          if(!(Test-Path $receipt)){throw 'R290_RECEIPT_MISSING'}
          $r=Get-Content $receipt -Raw | ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Status -cne 'PASS' -or
             $r.TestCount -ne 12 -or $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.OwnerComputerTouched -ne $false -or
             $r.WindowsCreatedOnlyInHostedDisposable -ne $true -or
             $r.RealExplorerStartAndSettingsVisuallyTested -ne $false){
            throw 'R290_TYPED_NATIVE_ACCEPTANCE_FAILED'
          }
          'R290_TYPED_NATIVE_ZORDER_ACCEPTANCE_PASS'

      - name: Preserve bounded Windows native test receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R290-NATIVE-ZORDER-${{ matrix.os }}-${{ github.sha }}
          retention-days: 21
          if-no-files-found: warn
          path: ${{ runner.temp }}/R290_NATIVE_ZORDER_RECEIPT.json
