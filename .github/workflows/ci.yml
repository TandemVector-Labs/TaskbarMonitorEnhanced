        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R300-HostedFreshInstall.ps1)
          foreach($mark in @(
            'R300_HOSTED_SETUP_RESOURCE_VERIFY=PASS',
            'R300_HOSTED_REAL_FRESH_INSTALL_AND_EXACT_BINARY_HASHES=PASS',
            'R300_HOSTED_ONE_ROOT_START_MENU_REGISTRY_AND_STARTUP_FALSE=PASS',
            'R300_HOSTED_REAL_INSTALL_SENSOR_STATE_AND_EXTERNAL_CANARY=PASS',
            'R300_HOSTED_FRESH_INSTALL_RECEIPT=PASS'
          )){
            if($proof -notcontains $mark){throw ('R300_REAL_FRESH_INSTALL_PROOF_MISSING_'+$mark)}
          }
          $src=Join-Path $env:RUNNER_TEMP 'R300_HOSTED_FRESH_INSTALL_RECEIPT.json'
          if(!(Test-Path $src)){throw 'R300_ACCEPTANCE_RECEIPT_MISSING'}
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath $src -Destination artifacts/R300_HOSTED_FRESH_INSTALL_RECEIPT.json -ErrorAction Stop
          $proof

      - name: Upload compiled original fresh-install receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r300-disposable-fresh-install
          if-no-files-found: error
          path: artifacts/R300_HOSTED_FRESH_INSTALL_RECEIPT.json
