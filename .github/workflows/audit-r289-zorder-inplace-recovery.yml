name: R289 isolated v1.7.8 to v1.7.9 Z-order Setup recovery

on:
  push:
    branches: [development/v1.7.9-zorder-fix]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'build/**'
      - '.github/workflows/audit-r289-zorder-inplace-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build private unsigned v1.7.9 candidate (not a public release)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400
      - name: Build hash-bound private Setup candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
             $env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows'){throw 'R289_BAD_HOSTED_SOURCE'}
          $source=Get-Content src/TaskbarMonitorEnhanced.cs -Raw
          $glass=Get-Content src/TaskbarGlass.cs -Raw
          if(!$glass.Contains('TaskbarSiblingCovers') -or
             !$glass.Contains('ShouldRepairOcclusion') -or
             !$glass.Contains('TASKBAR_ZORDER_OCCLUSION_REPAIR')){
              throw 'R289_ZORDER_FIX_MISSING'
          }
          ./build/Build.ps1
          if($LASTEXITCODE -ne 0){throw 'R289_VERSIONED_BUILD_FAILED'}
          $setup='build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.9.exe'
          $main='build/_out/App/TaskbarMonitorEnhanced.exe'
          if(!(Test-Path $setup) -or !(Test-Path $main)){throw 'R289_PRIVATE_BINARIES_MISSING'}
          $record=[ordered]@{
            Schema=1;Status='PRIVATE_NOT_A_RELEASE';Commit=$env:GITHUB_SHA
            Version='1.7.9';Private=$true;NotForPublicInstallation=$true
            SetupSHA256=(Get-FileHash $setup).Hash
            MainSHA256=(Get-FileHash $main).Hash
          }
          [IO.File]::WriteAllText('build/_out/CANDIDATE.json',($record|ConvertTo-Json -Depth 4),[Text.UTF8Encoding]::new($false))
          'R289_CANDIDATE_COMPILED_AND_HASH_BOUND'
      - name: Upload bounded candidate for disposable tests only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R289-PRIVATE-ZORDER-CANDIDATE-NOT-PUBLIC
          if-no-files-found: error
          retention-days: 14
          path: |
            build/_out/CANDIDATE.json
            build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.9.exe
            build/_out/App/TaskbarMonitorEnhanced.exe

  cold-recovery:
    name: Recovery exact Main candidate on isolated Windows ${{ matrix.host }}
    needs: candidate
    timeout-minutes: 18
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: A
            os: windows-2025
          - host: B
            os: windows-2022
    steps:
      - name: Exact candidate source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve private candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R289-PRIVATE-ZORDER-CANDIDATE-NOT-PUBLIC
          path: _r284_private_candidate
      - name: Preflight script parser and strict disposable host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:COMPUTERNAME -match 'EMAD-PC'){throw 'R289_UNSAFE_NON_DISPOSABLE_HOST'}
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'R289_BAD_SOURCE_CHECKOUT'}
          $p=(Resolve-Path build/Test-R289-ZOrder-InPlaceRecovery.ps1).Path
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|ForEach-Object{$_.Message};throw 'R289_PS51_SCRIPT_PARSER_INVALID'}
          if(!(Test-Path build/official-v178-managed.json)){throw 'R289_PINNED_176_MISSING'}
          $c=Get-Content _r284_private_candidate/CANDIDATE.json -Raw|ConvertFrom-Json
          if($c.Commit -cne $env:GITHUB_SHA -or $c.Version -cne '1.7.9' -or
             $c.Private -ne $true -or $c.NotForPublicInstallation -ne $true){throw 'R289_NOT_EXACT_PRIVATE_CANDIDATE'}
          'R289_GUEST_PRECONDITION_PASS'
      - name: Force helper crash; prove residue recovery, and real Setup kill on B
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-R289-ZOrder-InPlaceRecovery.ps1 -HostLabel '${{ matrix.host }}' -CandidateDir (Resolve-Path _r284_private_candidate).Path
          if($LASTEXITCODE -ne 0){throw 'R289_GUEST_TEST_FAILED'}
          $p=Join-Path $env:RUNNER_TEMP ('R289_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R289_RECOVERY_RECEIPT.json')
          if(!(Test-Path $p)){throw 'R289_GUEST_RECEIPT_MISSING'}
          $r=Get-Content $p -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R289' -or
             $r.Status -cne 'PASS_EXACT_V178_SETUP_RETRY_AFTER_STRANDED_RESTORE' -or
             $r.Host -cne '${{ matrix.host }}' -or
             $r.SourceCommit -cne $env:GITHUB_SHA -or
             $r.PreviousManifestRowsSHAAndSizeChecked -ne 22 -or
             $r.StagingHelperActuallyKilled -ne $true -or
             $r.StrandedUpdaterOwnedRestoreZeroByteProven -ne $true -or
             $r.RecoveredAfterSecondNativeSetupRun -ne $true -or
             $r.SingleCanonicalUserRootPreserved -ne $true -or
             $r.ProtectedUserDataHashPreserved -ne $true -or
             $r.JournalRemoved -ne $true -or
             $r.OriginalOwnerComputerTouched -ne $false -or
             $r.PhysicalMainsLossTriggered -ne $false){throw 'R289_RECEIPT_TYPED_PASS_FAILED'}
          if('${{ matrix.host }}' -ceq 'B' -and
             ($r.NativeSetupProcessActuallyKilled -ne $true -or
              $r.NativeSetupManagedNoteDeletionWitnessed -ne $true)){throw 'R289_REAL_SETUP_KILL_NOT_WITNESSED'}
          'R289_GUEST_TYPED_RECOVERY_PASS'
      - name: Preserve bounded guest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R289-guest-${{ matrix.host }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 21
          path: |
            ${{ runner.temp }}/R289_${{ matrix.host }}_${{ github.run_id }}/R289_RECOVERY_RECEIPT.json
            ${{ runner.temp }}/R289_${{ matrix.host }}_${{ github.run_id }}/ARMED.json
