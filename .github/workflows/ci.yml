name: Build and Verification

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'audit/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      - name: Git whitespace check
        shell: pwsh
        run: git diff --check HEAD^

      - name: G13 G14 independent host witness contracts (22 adversarial scenarios)
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          python -B ./build/verify_host_acceptance.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Host proof parser failed.' }
          python -B ./build/test_host_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'G13/G14 signed witness contract regressions failed.' }
          $registry = Get-Content ./build/host_acceptance_trust.json -Raw | ConvertFrom-Json
          if ($registry.Schema -ne 1 -or @($registry.TrustedWitnesses).Count -ne 0) { throw 'Unreviewed production lab key detected.' }

      - name: G15 SignPath request origin/signed payload contract (negative regression)
        shell: pwsh
        run: |
          python -B ./build/verify_signpath_g15.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'G15 Python static parser failed.' }
          python -B ./build/test_signpath_g15.py
          if ($LASTEXITCODE -ne 0) { throw 'G15 provider origin/signed artifact regression failed.' }
          # This never signs or invokes the real provider; real G15 acceptance stays external.

      - name: G16 public release asset contract (32 hostile regressions)
        shell: pwsh
        run: |
          python -B ./build/verify_public_release_g16.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'G16 Python parser/static preflight failed.' }
          python -B ./build/test_public_release_g16.py
          if ($LASTEXITCODE -ne 0) { throw 'G16 release manifest, SHA256SUMS and CI negative regressions failed.' }

      - name: Reproducible build
        shell: pwsh
        run: ./build/Build.ps1

      - name: R322 embedded backend ZIP archive/hostile entries (native .NET Framework)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-BackendZip-R322.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R322 backend ZIP / PE-resource hostile-archive regression failed.' }
      - name: R323 owned-shortcut-only deletion preserves unrelated .lnk files (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-ShortcutOwnership-R323.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R323 foreign-shortcut deletion guard regressed.' }
      - name: R324 reject foreign existing shortcuts before fresh install writes
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-ShortcutCreation-R324.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R324 shortcut ownership-before-Save regression failed.' }
      - name: R324 SHA-pinned ZIP integrity preflight before backend mutation (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-BackendArchiveHash-R324.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R324 archive SHA integrity and old backend preservation regression failed.' }
      - name: R326 exact Main CreateProcess without ShellExecute and arguments (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R326-DirectMainProcess-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R326 pinned Main direct CreateProcess native security tests failed.' }
      - name: R327 canonical profile Temp instead of mutable TEMP/TMP (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R327-CanonicalSensorTemp-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R327 canonical sensor Temp, reparse and environment-negative tests failed.' }
      - name: R328 protected Helper post-preflight log/result boundary (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R328-HelperLogBoundary-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R328 Sensor Helper user log/result reparse boundary checks failed.' }
      - name: R329 pinned Main blocks user-profile ancestor rename (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R329-PinnedMainAncestorRename-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R329 same-process and cross-process pinned Main ancestor rename regression failed.' }
      - name: R330 native synchronous directory signal fallback only kills exact owned worker (6 tests)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R330-NativeStageDeleteObserver-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R330 synthetic exact-PID NativeKnownStageDelete observer regression failed.' }
      - name: R331 no runner-controlled diagnostic writes in shipped Setup PE (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R331-NoHostedDiagnosticWrite-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R331 fail-closed Setup minus hosted diagnostic sink native regression failed.' }

      - name: R332 canonical protected sensor reuse, junction and health-state bounds (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R332-SensorReuseBoundary-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R332 protected sensor reuse boundary native negative checks failed.' }

      - name: R333 exact shortcut name occupancy, dangling reparse and foreign owner (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R333-ShortcutNameOccupied-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R333 compiled Setup shortcut occupancy negative test failed.' }

      - name: R334 three remaining Setup command sink trust contracts (compiled native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R334-CommandSinkContracts-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R334 no-UAC three-process-command-sink adversarial contract regression failed.' }

      - name: R335 privileged user log/result sink pinned handle boundary (native)
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R335-AtomicUserLogSink-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R335 compiled privileged Helper scoped handle guard regressions failed.' }

      - name: Verify deterministic clean-clone build
        shell: pwsh
        run: ./build/Verify-Determinism.ps1

      - name: Signed-staging separation regression (keep unsigned deterministic build pristine)
        shell: pwsh
        run: |
          ./build/Test-Signed-Staging.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Signed artifact staging separation gate failed.' }

      - name: G15 embedded signed Main payload contract (read-only installer verification)
        shell: pwsh
        run: |
          ./build/Test-Signed-Payload-Contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Setup failed to embed exact staged Main SHA256.' }

      - name: G15 OSS proprietary upstream exclusion negative test
        shell: pwsh
        run: |
          ./build/Test-NoPawnIO-OssRelease.ps1
          if ($LASTEXITCODE -ne 0) { throw 'A signed Setup may not embed the official PawnIO binary.' }

      - name: R85 absent PawnIO must degrade safely without driver or sensor mutation
        shell: pwsh
        run: |
          ./build/Test-PawnIO-External-Degrade.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Optional driver missing state tried unsafe protected mutation.' }

      - name: All-theme glass and chart visual acceptance (10 suites)
        shell: pwsh
        run: |
          ./build/Test-Workspace.ps1 -Executable ./build/_out/App/TaskbarMonitorEnhanced.exe -OutputDirectory ./artifacts/ci-visual -Visual
          if ($LASTEXITCODE -ne 0) { throw 'Visual regression suite failed.' }
          $v = Get-Content ./artifacts/ci-visual/SUMMARY.json -Raw | ConvertFrom-Json
          if ($v.Status -ne 'PASS' -or @($v.Results).Count -ne 10 -or @($v.Results | Where-Object Status -ne 'PASS').Count -ne 0) { throw 'Exactly ten visual and feature tests did not PASS.' }
          $chart = Get-Content ./artifacts/ci-visual/chartglassproof/CHART_GLASS_PROOF.json -Raw | ConvertFrom-Json
          if ($chart.Status -ne 'PASS' -or $chart.Themes -ne 49 -or $chart.Pairs -ne 196) { throw '49-theme 196-case chart foreground proof did not PASS.' }
          $glass = Get-Content ./artifacts/ci-visual/glassproof/GLASS_PROOF.json -Raw | ConvertFrom-Json
          if ($glass.Status -ne 'PASS' -or $glass.Tests -ne 196) { throw '49-theme alpha contrast foreground proof did not PASS.' }

      - name: R272 semantic thermal warnings visible as red ink in Glass on all 49 themes
        shell: pwsh
        run: |
          ./build/Test-GlassThermal-R272.ps1 -MainPath ./build/_out/App/TaskbarMonitorEnhanced.exe -OutDir ./artifacts/ci-thermal-r272
          $r = Get-Content ./artifacts/ci-thermal-r272/R272_ACCEPTANCE.json -Raw | ConvertFrom-Json
          if ($r.Status -cne 'PASS' -or $r.ThemePairs -ne 98 -or $r.AlertPixelMinimum -lt 40 -or $r.ColdPixelMaximum -ne 0) {
              throw 'R272 threshold-to-red foreground Glass semantic contract failed.'
          }
      - name: R244 nine-page Settings UI overlap and Glass mode renderer guard
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-SettingsUi-R244.ps1 -MainPath ./build/_out/App/TaskbarMonitorEnhanced.exe -OutDir ./artifacts/ci-settings-r244
          $s = Get-Content ./artifacts/ci-settings-r244/R244_SETTINGS_UI.json -Raw | ConvertFrom-Json
          if($s.Status -cne 'PASS_ALL_NINE_SETTINGS_PAGES_NO_CONTROL_OVERLAP' -or
             $s.SettingsPages -ne 9 -or $s.SiblingOverlapCount -ne 0 -or
             $s.GlassStatusSeparate -ne $true -or $s.GlassTrackBackAlpha -ne 255) {
             throw 'R244.Settings UI glass switch overlap/layout regression'
          }

      - name: Portable runtime contract probes (5 suites; installed host checks separate)
        shell: pwsh
        run: |
          ./build/Test-Runtime.ps1 -Executable ./build/_out/App/TaskbarMonitorEnhanced.exe -OutputDirectory ./artifacts/ci-runtime -CiContract
          # Test-Runtime.ps1 uses Diagnostics.Process and validates child exit codes itself.
          # Its summary and thrown exceptions are authoritative, not a nullable LASTEXITCODE.
          $r = Get-Content ./artifacts/ci-runtime/SUMMARY.json -Raw | ConvertFrom-Json
          if ($r.Status -ne 'PASS' -or $r.Mode -ne 'CI_PORTABLE_5' -or @($r.Results).Count -ne 5 -or @($r.Results | Where-Object Status -ne 'PASS').Count -ne 0) { throw 'Five portable CI runtime probes did not PASS. Installed health and Start/Shell probes remain separate stable gates.' }

      - name: Generate SPDX 2.3 SBOM
        shell: pwsh
        run: ./build/Generate-Sbom.ps1

      - name: R136 release manifest and SBOM must match actual versioned setup bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./build/Verify-Release-Metadata-R273.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {throw 'R136 release version, 5 output SHA and SBOM source gates FAILED'}

      - name: Attest binary build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'build/_out/**/*.exe'

      - name: Attest runtime config provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'build/_out/App/TaskbarMonitorEnhanced.exe.config'

      - name: Attest Setup SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'build/_out/Setup/TaskbarMonitorEnhanced_Setup_*.exe'
          sbom-path: 'artifacts/SBOM.spdx.json'

      - name: Upload verified build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence
          if-no-files-found: error
          path: |
            build/_out/contracts/SUMMARY.json
            artifacts/DETERMINISM.json
            artifacts/ci-visual/SUMMARY.json
            artifacts/ci-visual/chartglassproof/CHART_GLASS_PROOF.json
            artifacts/ci-visual/glassproof/GLASS_PROOF.json
            artifacts/ci-thermal-r272/R272_ACCEPTANCE.json
            artifacts/ci-thermal-r272/real-thermal-pixels/THERMAL_GLASS_PROOF.json
            artifacts/ci-settings-r244/R244_SETTINGS_UI.json
            artifacts/ci-settings-r244/R244_GLASS_SWITCH_ON.png
            artifacts/ci-runtime/SUMMARY.json
            artifacts/BUILD_MANIFEST.json
            artifacts/SBOM.spdx.json
            build/_out/App/TaskbarMonitorEnhanced.exe
            build/_out/App/TaskbarMonitorEnhanced.exe.config
            build/_out/Broker/TaskbarMonitorSensorBroker.exe
            build/_out/Supervisor/TaskbarMonitorSensorSupervisor.exe
            build/_out/Setup/TaskbarMonitorEnhanced_Setup_*.exe

      - name: Print build manifest
        shell: pwsh
        run: Get-Content ./artifacts/BUILD_MANIFEST.json

  r324-fresh-shortcut:
    name: R324 genuine fresh Windows shortcut negative ${{ matrix.host }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: A
            os: windows-2025
          - host: B
            os: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout exact disposable test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download exact private build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8
        with:
          name: build-evidence
          path: r324_built_private
      - name: Original Setup must refuse foreign Start shortcut before any app root write
        shell: powershell
        env:
          TBME_R324_RUN_FRESH_HOST_NEGATIVE: 'true'
          R324_HOST_LABEL: ${{ matrix.host }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) {throw 'R324_GUEST_SOURCE_NOT_PINNED'}
          $files=@(Get-ChildItem r324_built_private -Recurse -File)
          $mf=@($files|Where-Object Name -eq 'BUILD_MANIFEST.json')
          $sx=@($files|Where-Object Name -eq 'TaskbarMonitorEnhanced_Setup_1.7.8.exe')
          $mx=@($files|Where-Object Name -eq 'TaskbarMonitorEnhanced.exe')
          if($mf.Count -ne 1 -or $sx.Count -ne 1 -or $mx.Count -ne 1){throw 'R324_UNEXPECTED_CANDIDATE_FILES'}
          $manifest=Get-Content -LiteralPath $mf[0].FullName -Raw|ConvertFrom-Json
          $sm=@($manifest.Outputs|Where-Object Name -eq 'TaskbarMonitorEnhanced_Setup_1.7.8.exe')
          $mm=@($manifest.Outputs|Where-Object Name -eq 'TaskbarMonitorEnhanced.exe')
          if($sm.Count -ne 1 -or $mm.Count -ne 1 -or
             (Get-FileHash $sx[0].FullName -Algorithm SHA256).Hash -cne [string]$sm[0].SHA256 -or
             (Get-FileHash $mx[0].FullName -Algorithm SHA256).Hash -cne [string]$mm[0].SHA256){
            throw 'R324_CANDIDATE_BINARY_DIGEST_MISMATCH'
          }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-ShortcutCreation-R324.ps1 -SetupPath $sx[0].FullName -MainPath $mx[0].FullName
          if($LASTEXITCODE -ne 0){throw 'R324_REAL_SETUP_NEGATIVE_FAILED'}
          $proof=Join-Path $env:RUNNER_TEMP ('R324_'+$env:R324_HOST_LABEL+'_'+$env:GITHUB_RUN_ID+'\R324_HOSTED_SHORTCUT_RECEIPT.json')
          $r=Get-Content -LiteralPath $proof -Raw|ConvertFrom-Json
          if($r.SourceCommit -cne $env:GITHUB_SHA -or $r.Host -cne $env:R324_HOST_LABEL -or
             $r.Status -cne 'PASS_REAL_FRESH_SETUP_REFUSES_FOREIGN_START_SHORTCUT_BEFORE_APPROOT' -or
             !$r.UserAppRootAbsentBeforeAndAfter -or !$r.SameStartShortcutSHA256Preserved -or
             !$r.UnownedLinkRemovedAfterWitness -or $r.NativeReflectionChecksPassed -ne 8){
            throw 'R324_TYPED_RECEIPT_CONTRACT_FAILED'
          }
      - name: R331 real Setup refuses environment-spoofed diagnostic writes on guest ${{ matrix.host }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){
            throw 'R331_REFUSE_NON_DISPOSABLE_HOST_OR_SOURCE'
          }
          $setups=@(Get-ChildItem r324_built_private -Recurse -File -Filter 'TaskbarMonitorEnhanced_Setup_1.7.8.exe')
          $manifests=@(Get-ChildItem r324_built_private -Recurse -File -Filter 'BUILD_MANIFEST.json')
          if($setups.Count -ne 1 -or $manifests.Count -ne 1){throw 'R331_EXACT_PRIVATE_BIN_NOT_UNIQUE'}
          $buildManifest=Get-Content $manifests[0].FullName -Raw|ConvertFrom-Json
          $setupEntry=@($buildManifest.Outputs|Where-Object Name -eq 'TaskbarMonitorEnhanced_Setup_1.7.8.exe')
          if($setupEntry.Count -ne 1 -or
             (Get-FileHash $setups[0].FullName -Algorithm SHA256).Hash -cne $setupEntry[0].SHA256){
            throw 'R331_HOSTED_SETUP_BINARY_NOT_MANIFEST_PINNED'
          }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R331-NoHostedDiagnosticWrite-Native.ps1 -SetupPath $setups[0].FullName -HostedFresh -HostLabel '${{ matrix.host }}'
          if($LASTEXITCODE -ne 0){throw 'R331_REAL_NEGATIVE_GUEST_TEST_FAILED'}
          $receipt=Join-Path $env:RUNNER_TEMP ('R331_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R331_HOSTED_DIAGNOSTIC_REMOVAL_RECEIPT.json')
          if(!(Test-Path $receipt -PathType Leaf)){throw 'R331_HOSTED_TYPED_RECEIPT_MISSING'}
          $r=Get-Content $receipt -Raw|ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R331' -or $r.Host -cne '${{ matrix.host }}' -or
             $r.SourceCommit -cne $env:GITHUB_SHA -or $r.SetupSHA256 -cne $setupEntry[0].SHA256 -or
             $r.Status -cne 'PASS_FRESH_REAL_SETUP_FAIL_CLOSED_WITHOUT_HOSTED_DIAGNOSTIC_WRITE' -or
             $r.RealSetupExecuted -ne $true -or $r.SetupExit -ne 34 -or
             $r.DiagnosticOutputAbsent -ne $true -or $r.CanaryPreserved -ne $true -or
             $r.InstalledAppUntouched -ne $true -or $r.OwnerMachineTouched -ne $false -or
             $r.MainWasNotLaunched -ne $true -or $r.ElevatedUACNotInvoked -ne $true -or
             $r.SecurityFinalAccepted -ne $false -or @($r.Checks).Count -ne 12){
            throw 'R331_HOSTED_NEGATIVE_RECEIPT_IDENTITY_FAILED'
          }
      - name: Preserve bounded raw R331 guest diagnostic-negative receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: R331-diag-guest-${{ matrix.host }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/R331_${{ matrix.host }}_${{ github.run_id }}/R331_HOSTED_DIAGNOSTIC_REMOVAL_RECEIPT.json

      - name: R332 real compiled Setup rejects ProgramFiles and user-health reparse on guest ${{ matrix.host }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){
            throw 'R332_NOT_THE_DISPOSABLE_EXACT_GUEST'
          }
          $setup=@(Get-ChildItem r324_built_private -Recurse -File -Filter 'TaskbarMonitorEnhanced_Setup_1.7.8.exe')
          $mf=@(Get-ChildItem r324_built_private -Recurse -File -Filter 'BUILD_MANIFEST.json')
          if($setup.Count -ne 1 -or $mf.Count -ne 1){throw 'R332_CANDIDATE_AND_MANIFEST_NOT_UNIQUE'}
          $manifest=Get-Content $mf[0].FullName -Raw|ConvertFrom-Json
          $m=@($manifest.Outputs|Where-Object Name -eq 'TaskbarMonitorEnhanced_Setup_1.7.8.exe')
          if($m.Count -ne 1 -or (Get-FileHash $setup[0].FullName -Algorithm SHA256).Hash -cne [string]$m[0].SHA256){
            throw 'R332_SETUP_PRIVATE_BINARY_NOT_MANIFEST_PINNED'
          }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./build/Test-R332-SensorReuseBoundary-Native.ps1 -SetupPath $setup[0].FullName -HostedGuest -HostLabel '${{ matrix.host }}'
          if($LASTEXITCODE -ne 0){throw 'R332_PROTECTED_REUSE_NEGATIVE_TEST_FAILED'}
          $receipt=Join-Path $env:RUNNER_TEMP ('R332_${{ matrix.host }}_'+$env:GITHUB_RUN_ID+'/R332_SENSOR_REUSE_BOUNDARY_RECEIPT.json')
          if(!(Test-Path -LiteralPath $receipt -PathType Leaf)){throw 'R332_TYPED_GUEST_RECEIPT_MISSING'}
          $r=Get-Content -LiteralPath $receipt -Raw |ConvertFrom-Json
          if($r.Schema -ne 1 -or $r.Revision -cne 'R332' -or $r.Host -cne '${{ matrix.host }}' -or
             $r.SourceCommit -cne $env:GITHUB_SHA -or $r.SetupSHA256 -cne [string]$m[0].SHA256 -or
             $r.Status -cne 'PASS_CANONICAL_SENSOR_REUSE_JUNCTION_FAIL_CLOSED' -or @($r.Checks).Count -ne 18 -or
             $r.RealCompiledNetFrameworkSetupLoaded -ne $true -or $r.ProgramFilesRealRootModified -ne $false -or
             $r.ActualSensorHelperElevated -ne $false -or $r.OwnerInstalledProgramChanged -ne $false -or
             $r.ExternalCanaryPreserved -ne $true -or $r.AtomicReparseRaceProven -ne $false -or
             $r.SecurityFinalAccepted -ne $false){
            throw 'R332_TYPED_GUEST_IDENTITY_OR_SCOPE_INVALID'
          }
      - name: Preserve bounded R332 reparse-negative guest receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: R332-reuse-guest-${{ matrix.host }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/R332_${{ matrix.host }}_${{ github.run_id }}/R332_SENSOR_REUSE_BOUNDARY_RECEIPT.json

      - name: R333 compiled Setup preserves all occupied foreign Shortcut names on guest ${{ matrix.host }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
